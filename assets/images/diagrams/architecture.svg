<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" width="700" height="260">
  <style>.box{fill:#FFFFFF;stroke:rgba(15,23,42,0.08);stroke-width:1;rx:12}.title{font:700 11px Inter,sans-serif;fill:#0F172A}.sub{font:500 10px Inter,sans-serif;fill:#64748B}.line{stroke:rgba(15,23,42,0.12);stroke-width:1.2;marker-end:url(#arrow)}</style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/></marker></defs>
  <rect x="20" y="70" width="140" height="80" class="box"/><text x="90" y="100" text-anchor="middle" class="title">GT-511C3</text><text x="90" y="118" text-anchor="middle" class="sub">UART /dev/serial0</text><text x="90" y="134" text-anchor="middle" class="sub">TX→RX 9600</text>
  <rect x="220" y="70" width="160" height="80" class="box"/><text x="300" y="100" text-anchor="middle" class="title">Raspberry Pi</text><text x="300" y="118" text-anchor="middle" class="sub">raspberrypi123 • lancer</text><text x="300" y="134" text-anchor="middle" class="sub">Debian 13 • 192.168.1.8</text>
  <rect x="440" y="70" width="140" height="80" class="box"/><text x="510" y="100" text-anchor="middle" class="title">Backend</text><text x="510" y="118" text-anchor="middle" class="sub">Flask + SQLite</text><text x="510" y="134" text-anchor="middle" class="sub">:5000 /api</text>
  <rect x="540" y="170" width="140" height="50" class="box"/><text x="610" y="192" text-anchor="middle" class="title">assets/images</text><text x="610" y="206" text-anchor="middle" class="sub">admin / students</text>
  <rect x="40" y="170" width="140" height="50" class="box"/><text x="110" y="192" text-anchor="middle" class="title">Browser UI</text><text x="110" y="206" text-anchor="middle" class="sub">Prototype HTML</text>
  <line x1="160" y1="110" x2="220" y2="110" class="line"/><line x1="380" y1="110" x2="440" y2="110" class="line"/><line x1="510" y1="150" x2="610" y2="170" class="line"/><line x1="110" y1="170" x2="300" y2="150" class="line"/>
</svg>
